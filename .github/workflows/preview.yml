name: Checks

# Every branch and pull request gets the same checks main gets before it
# deploys. A push to the preview branch also rebuilds the site so /next/
# shows it (the deploy itself always runs from main).

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  preview:
    needs: checks
    if: github.event_name == 'push' && github.ref_name == (vars.PREVIEW_BRANCH || 'pin-refresh-2kmumy')
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
