name: Deploy to GitHub Pages

# The live site is built from main. The preview branch (repository variable
# PREVIEW_BRANCH, default pin-refresh-2kmumy) is built in demo mode into /next/
# next to it, so changes can be tried on a phone before friends see them.
# Pushing to the preview branch re-runs this workflow (see preview.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: ${{ vars.PREVIEW_BRANCH || 'pin-refresh-2kmumy' }}

jobs:
  # The preview builds on its own, with no deploy rights, and its failure never
  # holds back the live site: /next/ is just left out.
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - id: branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$PREVIEW_BRANCH" > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "No preview branch $PREVIEW_BRANCH"; fi
      - if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          persist-credentials: false
      - if: steps.branch.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.branch.outputs.exists == 'true'
        run: |
          npm ci
          npm test
          npx tsc -b
          # demo mode: no Firebase, nothing touches real accounts; own storage keys
          VITE_STORAGE_PREFIX=next: npx vite build --mode demo
      - if: steps.branch.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist
          retention-days: 1

  build:
    needs: preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Firebase web config comes from repository variables (Settings → Secrets and
      # variables → Actions → Variables). Without them the site is guest-only.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - if: needs.preview.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preview
          path: dist/next
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
